<button type="button" class="table-node {{ table().accent }}" [class.table-target]="selectedGuestId() !== null && seatCount() < table().capacity" [class.table-full]="seatCount() >= table().capacity" [class.table-dragging]="tableDragging()" [style.left.px]="leftPx()" [style.top.px]="topPx()" [style.scale]="tableScale()" (click)="handleClick()" (pointerdown)="beginPointerDrag($event)" (pointermove)="movePointerDrag($event)" (pointerup)="endPointerDrag($event)" (pointercancel)="cancelPointerDrag($event)" (lostpointercapture)="cancelPointerDrag($event)" [attr.aria-label]="table().name + ', ' + seatCount() + ' of ' + table().capacity + ' seats'">
  <span class="table-place-settings" [style.--seats]="table().capacity">
    @for (seat of [].constructor(table().capacity); track $index) {
      <i class="seat-dot" [class.occupied]="$index < seatCount()" [style.--seat]="$index"></i>
    }
    <span class="table-center"><strong>{{ table().name }}</strong><small>{{ seatCount() }} / {{ table().capacity }} seats</small></span>
  </span>
  <span class="table-guests">@for (guest of guestsAt().slice(0, 3); track guest.id) { <i>{{ guest.initials }}</i> } @if (seatCount() > 3) { <em>+{{ seatCount() - 3 }}</em> }</span>
</button>
<app-table-info-dialog [table]="table()" [guests]="guestsAt()" [visible]="infoVisible()" (closed)="closeInfo()" (deleteRequested)="requestDelete()" (clearRequested)="clearTable()" (unseatRequested)="unseatGuest($event)" />
<app-delete-table-dialog [table]="table()" [visible]="deleteConfirmationVisible()" (cancelled)="cancelDelete()" (confirmed)="confirmDelete()" />
